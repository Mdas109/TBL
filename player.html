
<!DOCTYPE html>
<html>
  <head>
    <!-- Include the jwplayer script -->
    <title>Tamil Box Live Player</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #000;
        overflow: hidden;
      }

      #player {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      .jwplayer {
        position: absolute !important;
      }
    </style>
  </head>
  <body>
    <!-- Video Player Container -->
    <div id="myElement"></div>
    <!-- JS -->
    <script>
      function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }
      const hlsUrl = getUrlParameter('hls');
      if (!hlsUrl) {
        alert('Invalid HLS URL');
      } else {
        var player = jwplayer("myElement");
        player.setup({
          file: decodeURIComponent(hlsUrl),
          autostart: true,
          mute: false,
          width: "100%",
          height: "100%",
          controls: true,
          stretching: "uniform",
          primary: "html5",
          androidhls: true,
          hlshtml: false,
          logo: {
            file: "https://mdas109.github.io/TBL/Screenshot_2025-04-17-20-54-17-14_7ecc343528d84aae1423bfb8eca3bd44.jpg",
            link: "index.html",
            position: "top-right",
            margin: 8,
            hide: true
          }
        });
      }
    </script>

</body>
</html>
